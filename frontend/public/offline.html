<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: grid;
      place-items: center;
      height: 100vh;
    }

    .container {
      max-width: 420px;
      padding: 32px;
      text-align: center;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    }

    h2 {
      margin: 0 0 8px 0;
      font-weight: 600;
    }

    p {
      margin: 0 0 16px 0;
      color: #475569;
      font-size: 14px;
    }

    button {
      border: 1px solid #0f172a;
      background: #0f172a;
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>You’re offline</h2>
    <p>Your device lost internet. Reconnect to continue using the app.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
