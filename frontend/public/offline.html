<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: grid;
      place-items: center;
      height: 100vh;
    }
    .box {
      text-align: center;
      padding: 24px;
      border: 1px solid #334155;
      border-radius: 12px;
      background: #020617;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>You are offline</h2>
    <p>Check your internet connection and reopen the app.</p>
  </div>
</body>
</html>
